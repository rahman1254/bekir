
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Bekir ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    background:#a0c4ff; /* Açık mavi arkaplan */
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
    transition: background-image 0.5s ease;
}

.kutu{
    background: rgba(255,255,255,0.9);
    padding:40px;
    border-radius:20px;
    text-align:center;
    max-width:400px;
}

button{
    margin-top:20px;
    padding:15px 30px;
    font-size:18px;
    border:none;
    border-radius:30px;
    background:#222;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#555;
}
</style>
</head>

<body>

<div class="kutu">
    <h1>💙 Aslan Abime 💙</h1>
    <p>Aslan abim, varlığın yeter.<br>
       Gücün ve kalbin her zaman yol gösterir bana.</p>
    <button onclick="degistir()">Fotoğrafı Göster 📸</button>
</div>

<script>
function degistir(){
    document.body.style.backgroundImage = "url('foto.jpg')";
    document.body.style.backgroundSize = "cover";
    document.body.style.backgroundPosition = "center";
}
</script>

</body>
</html>
